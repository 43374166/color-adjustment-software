# fdxmp iOS 工程定义（XcodeGen）
#
# 生成工程：先构建 Rust 静态库与 dist/ios/FdxmpCore.xcframework，然后
#   cd platforms/ios && xcodegen generate
# 或直接执行 packaging/ios/build-ipa.sh（推荐，包含全部步骤）。
name: Fdxmp

options:
  bundleIdPrefix: com.fdxmp
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    MARKETING_VERSION: "1.4.1"
    CURRENT_PROJECT_VERSION: "45"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Fdxmp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Fdxmp
        excludes:
          - Info.plist
      # 智能蒙版模型（CI 下载到 dist/ios/models；文件夹引用随包进 App，
      # 核心默认目录 = 可执行文件同级的 models/）。
      - path: ../../dist/ios/models
        type: folder
        buildPhase: resources
    dependencies:
      # Rust 核心静态库（由 packaging/ios/build-ipa.sh 生成）
      - framework: ../../dist/ios/FdxmpCore.xcframework
        embed: false
        codeSign: false
      # wgpu（Metal 后端）需要的系统框架（静态库不会自动带链接指令）
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: IOSurface.framework
      - sdk: CoreVideo.framework
    settings:
      base:
        PRODUCT_NAME: Fdxmp
        PRODUCT_BUNDLE_IDENTIFIER: com.fdxmp.app
        INFOPLIST_FILE: Fdxmp/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Fdxmp/Fdxmp-Bridging-Header.h
        # LibRaw（rsraw，C++）以静态库形式随 Rust 核心进包：最终链接显式带 libc++
        OTHER_LDFLAGS:
          - $(inherited)
          - -lc++
          # 随包 ONNX Runtime（pyke 静态库）需要的系统框架
          - -framework
          - CoreML
          - -framework
          - Accelerate
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../../crates/ffi/include
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"

schemes:
  Fdxmp:
    build:
      targets:
        Fdxmp: all
    run:
      config: Debug
    archive:
      config: Release
