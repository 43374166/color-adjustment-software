name: iOS 未签名 IPA

# 云打包：在 GitHub 的 macOS 运行器上编译 Rust 静态库 + SwiftUI App，
# 产出 dist/ios/Fdxmp-unsigned.ipa（未签名，下载后用 Sideloadly / AltStore 签名安装）。
on:
  workflow_dispatch:
  push:
    paths:
      - "platforms/ios/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ios-ipa.yml"

jobs:
  build:
    name: 构建 Fdxmp iOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust iOS 目标
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/Library/Caches/dfbin
            target
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('Cargo.lock') }}

      - name: 下载智能蒙版模型（hf-mirror，SHA-256 校验）
        run: |
          set -euo pipefail
          mkdir -p dist/ios/models
          base=https://hf-mirror.com
          curl -L --fail --retry 3 -o dist/ios/models/face_detector_scrfd2p5g_bnkps_fp32.onnx \
            "$base/RuteNL/SCRFD-face-detection-ONNX/resolve/main/2.5g_bnkps.onnx"
          curl -L --fail --retry 3 -o dist/ios/models/u2netp.onnx \
            "$base/BritishWerewolf/U-2-Netp/resolve/main/onnx/model.onnx"
          curl -L --fail --retry 3 -o dist/ios/models/face_landmarks_mediapipe_v2_fp32.onnx \
            "$base/fernandotonon/QtMeshEditor-facemesh-onnx/resolve/main/face_landmarks.onnx"
          # 人脸解析：自转 BiSeNet-19（MIT 权重，见 packaging/models/）——随仓库携带，保证哈希一致。
          cp models/face_parsing_bisenet19_fp32.onnx dist/ios/models/
          cd dist/ios/models
          shasum -a 256 -c <<'EOF'
          3f1ac54e769cb5fd76eda11ac3c088eed78d1f51a935a839d04d49b0e770219e  face_detector_scrfd2p5g_bnkps_fp32.onnx
          309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8  u2netp.onnx
          d16e5a55e6a480284d468ee32469692464049518c311662ab3956681de31e3e9  face_landmarks_mediapipe_v2_fp32.onnx
          2453dcc1592590d1f9f7b064b3031c20f35bca74375445d23ab7f5ad3c38ea2f  face_parsing_bisenet19_fp32.onnx
          EOF
          ls -lh

      - name: 构建 Rust 静态库
        run: |
          # ai-static：pyke 预编译 ONNX Runtime（CoreML 后端）静态链接进 Rust 静态库
          cargo rustc -p fdxmp-ffi --release --features gpu,raw,ai-static --target aarch64-apple-ios --crate-type staticlib
          cargo rustc -p fdxmp-ffi --release --features gpu,raw,ai-static --target aarch64-apple-ios-sim --crate-type staticlib

      - name: 合并 xcframework
        run: |
          rm -rf dist/ios/FdxmpCore.xcframework
          mkdir -p dist/ios
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libfdxmp_ffi.a \
            -library target/aarch64-apple-ios-sim/release/libfdxmp_ffi.a \
            -output dist/ios/FdxmpCore.xcframework

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: platforms/ios
        run: xcodegen generate

      - name: 编译 App（无签名）
        working-directory: platforms/ios
        run: |
          xcodebuild -project Fdxmp.xcodeproj \
            -scheme Fdxmp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包未签名 IPA
        run: |
          PLIST="platforms/ios/build/Build/Products/Release-iphoneos/Fdxmp.app/Info.plist"
          echo "CFBundleIdentifier: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          echo "CFBundleExecutable: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")"
          rm -rf dist/ios/Payload
          mkdir -p dist/ios/Payload
          cp -R platforms/ios/build/Build/Products/Release-iphoneos/Fdxmp.app dist/ios/Payload/
          cd dist/ios && zip -qry Fdxmp-unsigned.ipa Payload
          ls -lh Fdxmp-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Fdxmp-unsigned-ipa
          path: dist/ios/Fdxmp-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
