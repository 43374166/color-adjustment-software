[package]
name = "fdxmp-cli"
description = "fdxmp command-line test tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "fdxmp-cli"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
gpu = ["fdxmp-core/gpu"]
raw = ["fdxmp-core/raw"]
heif = ["fdxmp-core/heif"]
full = ["gpu", "raw", "heif"]

[dependencies]
fdxmp-core.workspace = true
fdxmp-color.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
