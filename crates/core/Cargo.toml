[package]
name = "fdxmp-core"
description = "fdxmp image processing core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
# wgpu render context
gpu = ["dep:wgpu", "dep:tokio"]
# LibRaw wrapper (rsraw)
raw = ["dep:rsraw"]
# libheif wrapper
heif = ["dep:libheif-rs"]
# desktop AI masks (ONNX Runtime, loaded dynamically)
ai = ["dep:ort", "dep:ureq", "ort/load-dynamic"]
# mobile AI masks (iOS: static prebuilt library + CoreML)
ai-static = [
    "dep:ort",
    "dep:ureq",
    "ort/download-binaries",
    "ort/coreml",
    "ort/tls-rustls",
]
# all features
full = ["gpu", "raw", "heif", "ai"]

[dependencies]
fdxmp-color = { workspace = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zip.workspace = true
rayon.workspace = true
ndarray.workspace = true
thiserror.workspace = true
image.workspace = true
kamadak-exif = "0.6.1"
ab_glyph.workspace = true
lcms2.workspace = true
flate2.workspace = true
bytemuck.workspace = true
lensfun.workspace = true
ort = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
rsraw = { version = "0.1.1", optional = true }
libheif-rs = { version = "3.0.0", optional = true }

[dev-dependencies]
criterion.workspace = true
rsraw-sys = "0.1.1"
# shader syntax self-check (naga shares wgpu 30)
naga = { version = "30.0.1", features = ["wgsl-in"] }

[[bench]]
name = "params_bench"
harness = false

[[bench]]
name = "decode_bench"
harness = false
