[package]
name = "fdxmp-core"
description = "fdxmp 图像处理核心：解码、色彩管线、蒙版、预设、缓存、历史"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
# wgpu 渲染上下文
gpu = ["dep:wgpu", "dep:tokio"]
# LibRaw 封装（rsraw）
raw = ["dep:rsraw"]
# libheif 封装（libheif-rs）
heif = ["dep:libheif-rs"]
# Windows AI 蒙版（ONNX Runtime，运行时加载 onnxruntime.dll）
ai = ["dep:ort", "dep:ureq"]
# 全能力（四端最终形态）
full = ["gpu", "raw", "heif", "ai"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
zip.workspace = true
rayon.workspace = true
ndarray.workspace = true
thiserror.workspace = true
image.workspace = true
ab_glyph.workspace = true
lcms2.workspace = true
flate2.workspace = true
bytemuck.workspace = true
lensfun.workspace = true
ort = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
rsraw = { version = "0.1.1", optional = true }
libheif-rs = { version = "3.0.0", optional = true }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "params_bench"
harness = false

[[bench]]
name = "decode_bench"
harness = false
