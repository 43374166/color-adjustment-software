[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/ffi",
    "crates/cli",
    "crates/win_ui",
    "crates/android_bridge",
    "crates/ohos_bridge",
    "packer_ui",
]

[workspace.package]
version = "1.1.2"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["fdxmp contributors"]

[workspace.dependencies]
# 内部 crate
fdxmp-core = { path = "crates/core", version = "1.1.2" }

# 序列化与归档（技术选型：serde + serde_json + zip）
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# 并行与数组（rayon / ndarray）
rayon = "1.12.0"
ndarray = "0.17.2"

# 错误与异步（thiserror / tokio）
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "fs",
    "io-util",
    "time",
] }

# 基准（criterion）
criterion = "0.8.2"

ab_glyph = "0.2.32"
# ICC 色彩管理（Little CMS；static 特性表示随包编译 C 源码）
lcms2 = { version = "6.1.1", features = ["static"] }
# 镜头配置文件校正（纯 Rust 版 LensFun，数据库内置；LGPL-3.0-or-later）
lensfun = "0.7.0"
# PNG iCCP 块需要 zlib 压缩（纯 Rust 后端）
flate2 = "1.1.4"
# 16bit ICC 转换需要按像素类型重解释切片（零拷贝）
bytemuck = "1.25.2"

# Windows AI 蒙版：ONNX Runtime（load-dynamic：运行时加载 onnxruntime.dll）
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "load-dynamic",
] }
# 模型下载（hf-mirror 等镜像）
ureq = "3.4.2"

# 图像格式（image crate；RAW / HEIF 见 core 的 raw / heif feature）
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "tiff",
    "webp",
    "bmp",
    "gif",
] }

# GPU 渲染（wgpu：Metal / Vulkan / DX12）
wgpu = "30.0.1"

# 桌面 UI 与打包器（egui / eframe）
egui = "0.36.2"
eframe = "0.36.2"
egui_extras = "0.36.2"
rfd = "0.17.2"
which = "8.0.6"

# Android FFI 桥接
jni = "0.22.4"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
